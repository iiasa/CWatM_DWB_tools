worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Proxy cache zone for MVT tiles (shared across workers)
    proxy_cache_path /tmp/nginx_tile_cache levels=1:2 keys_zone=tile_cache:10m max_size=500m inactive=10m;

    # Proxy cache zone for COG raster tiles — larger + longer TTL.
    # TiTiler sends Cache-Control: public, max-age=86400, so 24h aligns.
    proxy_cache_path /tmp/nginx_cog_cache levels=1:2 keys_zone=cog_cache:50m max_size=5g inactive=24h;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/x-protobuf;
        gzip_min_length 1000;

        # Allow large responses (subbasin data can be 50MB+)
        client_max_body_size 100m;

        # Proxy API requests to NestJS backend (strips /api/ prefix)
        location ^~ /api/ {
            proxy_pass http://backend:8085/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;

            # Large responses from subbasin/station endpoints
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }

        # SSE endpoint needs unbuffered proxying (point-graph streams partial results)
        location ^~ /api/point-graph/ {
            proxy_pass http://backend:8085/point-graph/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Proxy TiTiler tile requests (strips /tiles/ prefix).
        # COG tiles are cached for 24h — collapses thundering herds under pan/zoom.
        location ^~ /tiles/ {
            proxy_pass http://titiler:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache cog_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_background_update on;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_read_timeout 60s;
        }

        # MVT tile proxy with nginx caching (offloads repeated tile requests from backend)
        location ^~ /api/tiles/mvt/ {
            proxy_pass http://backend:8085/tiles/mvt/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache tile_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 204 1m;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # SPA fallback: serve index.html for client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively (CRA hashes filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
